<!DOCTYPE html>
<html lang="en">
<!-- PatientPath AI Login -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatientPath AI - Login</title>
    <script src="js/theme.js?v=2"></script>
    <script>
        // Clear stale session on page load — but NOT if handleLogin just set a token
        // (handleLogin sets a flag before redirecting)
        if (!sessionStorage.getItem('_loginRedirect')) {
            sessionStorage.removeItem('authToken');
            sessionStorage.removeItem('currentUser');
            sessionStorage.removeItem('currentRole');
            sessionStorage.removeItem('currentDept');
            sessionStorage.removeItem('currentName');
        }
        sessionStorage.removeItem('_loginRedirect');
    </script>
    <link rel="stylesheet" href="css/style.css?v=2">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-color);
            overflow: auto;
            flex-direction: column;
        }

        .login-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
            padding: 2.5rem;
            margin: 1.5rem;
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 0.625rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 0.375rem;
        }

        .login-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
        }

        .form-group {
            margin-bottom: 1.125rem;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 0.375rem;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            padding: 0.6rem 0.875rem;
            font-size: 0.9rem;
            color: var(--text-main);
            background: var(--input-bg, var(--card-bg));
            outline: none;
            transition: border-color 0.15s;
            font-family: inherit;
            box-sizing: border-box;
        }

        .form-group select:focus,
        .form-group input:focus {
            border-color: var(--primary-color);
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        /* Password wrapper */
        .pw-wrapper { position: relative; }
        .pw-wrapper input { padding-right: 2.75rem; }

        .pw-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            font-size: 0.95rem;
            line-height: 1;
            display: flex;
            align-items: center;
            transition: color 0.15s;
        }
        .pw-toggle:hover { color: var(--primary-color); }

        /* Requirements */
        .pw-requirements { margin-top: 0.5rem; padding: 0; list-style: none; }
        .pw-req-item {
            font-size: 0.75rem;
            padding: 0.125rem 0;
            display: flex;
            align-items: center;
            gap: 0.375rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }
        .pw-req-item i { font-size: 0.65rem; width: 12px; text-align: center; }
        .pw-req-item.met   { color: #22c55e; }
        .pw-req-item.unmet { color: #ef4444; }

        /* Department dropdown — hidden by default */
        #dept-group { display: none; }

        .btn-login {
            width: 100%;
            padding: 0.7rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-top: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-family: inherit;
        }
        .btn-login:hover:not(:disabled) { background: var(--primary-hover, #0284c7); }
        .btn-login:active:not(:disabled) { transform: scale(0.98); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }

        .error-msg {
            font-size: 0.83rem;
            color: #ef4444;
            background: rgba(239,68,68,0.1);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            margin-top: 0.875rem;
            display: none;
        }

        .signup-link {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 1.25rem;
        }

        .signup-link a {
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
        }
        .signup-link a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <div class="login-card fade-in">
        <div class="login-logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
            PatientPath AI
        </div>
        <p class="login-subtitle">Sign in to your account to continue</p>

        <div class="form-group">
            <label for="role-select">Access Role</label>
            <select id="role-select" onchange="updateLabels()">
                <option value="admin">Admin</option>
                <option value="doctor">Doctor</option>
                <option value="staff">Staff</option>
                <option value="patient">Patient</option>
            </select>
        </div>

        <div class="form-group" id="dept-group">
            <label for="dept-select">Department</label>
            <select id="dept-select">
                <option value="registration">Registration</option>
                <option value="vision_lab">Vision Lab</option>
                <option value="dilation_hall">Dilation Hall</option>
                <option value="diagnostics">Diagnostics</option>
                <option value="pharmacy">Pharmacy</option>
                <option value="billing_insurance">Billing &amp; Insurance</option>
            </select>
        </div>

        <div class="form-group">
            <label id="id-label" for="user-id">Admin ID</label>
            <input type="text" id="user-id" placeholder="Enter ID" autocomplete="username">
        </div>

        <div class="form-group" id="password-group">
            <label for="password">Password</label>
            <div class="pw-wrapper">
                <input type="password" id="password" placeholder="Enter password"
                       autocomplete="current-password" oninput="validatePasswordLive()">
                <button type="button" class="pw-toggle" onclick="togglePassword()" title="Show/hide password" aria-label="Show/hide password">
                    <i class="fas fa-eye" id="pw-eye-icon"></i>
                </button>
            </div>
            <ul class="pw-requirements" id="pw-requirements">
                <li class="pw-req-item" id="req-length"><i class="fas fa-circle"></i> Minimum 8 characters</li>
                <li class="pw-req-item" id="req-upper"><i class="fas fa-circle"></i> At least one uppercase letter</li>
                <li class="pw-req-item" id="req-lower"><i class="fas fa-circle"></i> At least one lowercase letter</li>
                <li class="pw-req-item" id="req-number"><i class="fas fa-circle"></i> At least one number</li>
                <li class="pw-req-item" id="req-symbol"><i class="fas fa-circle"></i> At least one symbol</li>
            </ul>
        </div>

        <button class="btn-login" id="login-btn" onclick="handleLogin()">
            <i class="fas fa-sign-in-alt"></i> Sign In
        </button>

        <div class="error-msg" id="error-msg"></div>

        <p class="signup-link">
            New here? <a href="signup.html">View demo credentials</a>
        </p>
    </div>

    <script>
        function togglePassword() {
            const pw = document.getElementById('password');
            const icon = document.getElementById('pw-eye-icon');
            if (pw.type === 'password') {
                pw.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                pw.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        }

        function checkPasswordRules(p) {
            return {
                length: p.length >= 8,
                upper:  /[A-Z]/.test(p),
                lower:  /[a-z]/.test(p),
                number: /[0-9]/.test(p),
                symbol: /[^A-Za-z0-9]/.test(p)
            };
        }

        function updateRequirementUI(rules, highlight) {
            const map = { length: 'req-length', upper: 'req-upper', lower: 'req-lower', number: 'req-number', symbol: 'req-symbol' };
            for (const [key, id] of Object.entries(map)) {
                const el = document.getElementById(id);
                const icon = el.querySelector('i');
                el.classList.remove('met', 'unmet');
                if (rules[key]) {
                    el.classList.add('met');
                    icon.className = 'fas fa-check-circle';
                } else if (highlight) {
                    el.classList.add('unmet');
                    icon.className = 'fas fa-times-circle';
                } else {
                    icon.className = 'fas fa-circle';
                }
            }
        }

        function validatePasswordLive() {
            updateRequirementUI(checkPasswordRules(document.getElementById('password').value), false);
        }

        function updateLabels() {
            const role = document.getElementById('role-select').value;
            const cfg = {
                admin:   { label: 'Admin ID',              ph: 'e.g. admin001' },
                doctor:  { label: 'Doctor ID',             ph: 'e.g. doctor001' },
                staff:   { label: 'Staff ID',              ph: 'e.g. staff001' },
                patient: { label: 'Patient Tracking ID',   ph: 'e.g. patient001' }
            };
            document.getElementById('id-label').textContent = cfg[role].label;
            document.getElementById('user-id').placeholder  = cfg[role].ph;
            document.getElementById('dept-group').style.display = role === 'staff' ? 'block' : 'none';
            const btn = document.getElementById('login-btn');
            if (btn) btn.innerHTML = role === 'patient'
                ? '<i class="fas fa-search"></i> Track Status'
                : '<i class="fas fa-sign-in-alt"></i> Sign In';
        }

        async function handleLogin() {
            const role   = document.getElementById('role-select').value;
            const userId = document.getElementById('user-id').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl  = document.getElementById('error-msg');
            const btn      = document.getElementById('login-btn');
            const dept     = document.getElementById('dept-select').value;

            errorEl.style.display = 'none';

            if (!userId) {
                errorEl.textContent = 'Please enter your ID.';
                errorEl.style.display = 'block';
                return;
            }
            if (!password) {
                errorEl.textContent = 'Please enter your password.';
                errorEl.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing in...';

            try {
                const resp = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: userId, password })
                });
                const data = await resp.json();

                if (!resp.ok) {
                    errorEl.textContent = data.detail || 'Invalid credentials. Please try again.';
                    errorEl.style.display = 'block';
                    return;
                }

                if (data.role !== role) {
                    errorEl.textContent = `This account has role '${data.role}', not '${role}'. Please select the correct role.`;
                    errorEl.style.display = 'block';
                    return;
                }

                sessionStorage.setItem('authToken',    data.token);
                sessionStorage.setItem('currentUser',  data.user_id);
                sessionStorage.setItem('currentRole',  data.role);
                sessionStorage.setItem('currentName',  data.name || data.user_id);

                if (role === 'staff') sessionStorage.setItem('currentDept', dept);

                sessionStorage.setItem('_loginRedirect', '1');

                if (data.role === 'patient') {
                    sessionStorage.setItem('currentPatientId', data.user_id);
                    window.location.href = 'patient_dashboard.html';
                } else {
                    window.location.href = 'index.html';
                }

            } catch (err) {
                errorEl.textContent = 'Unable to connect to server. Please try again.';
                errorEl.style.display = 'block';
            } finally {
                btn.disabled = false;
                const role2 = document.getElementById('role-select').value;
                btn.innerHTML = role2 === 'patient'
                    ? '<i class="fas fa-search"></i> Track Status'
                    : '<i class="fas fa-sign-in-alt"></i> Sign In';
            }
        }

        updateLabels();
    </script>
</body>
</html>
