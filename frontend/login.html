<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SANKARA EYE FOUNDATION | PatientPathAI</title>
    <meta name="description" content="Login to PatientPathAI – SANKARA EYE FOUNDATION's AI-powered hospital operations platform.">
    <script src="js/theme.js?v=1000"></script>
    <script>
        console.log("Login Page Loaded v6.0");
        // Clear any existing session to prevent confusion on load
        window.onload = function () {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentRole');
            localStorage.removeItem('currentDept');
            localStorage.removeItem('currentUserId');
            localStorage.removeItem('currentUsername');
            localStorage.removeItem('currentMobile');
            console.log("Session cleared for fresh login.");
        };
    </script>
    <link rel="stylesheet" href="css/auth.css?v=6.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="auth-container">

        <!-- LEFT PANEL -->
        <div class="auth-left">
            <img src="assets/doctor_hero.png" alt="Doctor" class="auth-left-img">
            <div class="auth-left-overlay"></div>
            <div class="auth-left-content">
                <div class="auth-left-logo">
                    <svg class="logo-icon" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="60" cy="50" rx="28" ry="28" fill="#E88A1A"/>
                        <polygon points="5,50 32,30 32,70" fill="#E88A1A"/>
                        <polygon points="115,50 88,30 88,70" fill="#E88A1A"/>
                        <circle cx="60" cy="50" r="18" fill="#F5A623" opacity="0.7"/>
                        <circle cx="60" cy="50" r="10" fill="#FFC857" opacity="0.5"/>
                    </svg>
                    <span>PatientPathAI</span>
                </div>
                <div class="auth-left-welcome">Welcome to<br>SANKARA EYE FOUNDATION</div>
                <p class="auth-left-sub">AI-powered patient flow management system with centralized, role-based dashboards.</p>
            </div>
        </div>

        <!-- RIGHT PANEL (Login Form) -->
        <div class="auth-right">
            <div class="auth-brand-top">
                <svg class="logo-icon" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="60" cy="50" rx="28" ry="28" fill="#E88A1A"/>
                    <polygon points="5,50 32,30 32,70" fill="#E88A1A"/>
                    <polygon points="115,50 88,30 88,70" fill="#E88A1A"/>
                    <circle cx="60" cy="50" r="18" fill="#F5A623" opacity="0.7"/>
                    <circle cx="60" cy="50" r="10" fill="#FFC857" opacity="0.5"/>
                </svg>
                <span class="brand-label">PatientPathAI</span>
            </div>

            <h2 class="auth-heading" id="login-heading">Login</h2>
            <p class="auth-subheading" id="login-subheading">Enter your credentials to access your account</p>

            <!-- Check-in banner (shown when redirected from staff allocation) -->
            <div id="checkin-banner" style="display:none; background:rgba(139,92,246,0.1); border:1px solid rgba(139,92,246,0.3); border-radius:8px; padding:0.75rem 1rem; margin-bottom:1rem; font-size:0.85rem; color:#8b5cf6;">
                <i class="fas fa-sign-in-alt"></i> <strong>Check-in verification required.</strong><br>
                <span style="font-size:0.8rem; color:var(--text-muted, #94a3b8);">Target department: <strong id="checkin-dept-display"></strong></span>
            </div>

            <div class="auth-form">
                <!-- Role Select -->
                <div class="form-group">
                    <label for="role-select">Select Access Role</label>
                    <select id="role-select" onchange="updateLabels()">
                        <option value="doctor">Doctor</option>
                        <option value="staff">Staff</option>
                        <option value="patient">Patient</option>
                    </select>
                </div>

                <!-- Department (staff only) -->
                <div class="form-group" id="dept-group" style="display: none;">
                    <label for="dept-select">Select Department</label>
                    <select id="dept-select">
                        <option value="registration">Registration</option>
                        <option value="vision_lab">Vision Lab</option>
                        <option value="dilation_hall">Dilation Hall</option>
                        <option value="diagnostics">Diagnostics</option>
                        <option value="pharmacy">Pharmacy</option>
                        <option value="billing_insurance">Billing & Insurance</option>
                    </select>
                </div>

                <!-- User ID / Mobile -->
                <div class="form-group">
                    <label id="id-label" for="user-id">Admin ID</label>
                    <input type="text" id="user-id" placeholder="Enter ID" onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
                </div>

                <!-- Password -->
                <div class="form-group" id="password-group">
                    <label for="password">Password</label>
                    <div class="pw-wrapper">
                        <input type="password" id="password" placeholder="Enter Password" onkeydown="if(event.key==='Enter')handleLogin()">
                        <button type="button" class="pw-toggle" onclick="togglePassword()" title="Show/Hide password">
                            <i class="fas fa-eye" id="pw-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Sign In -->
                <button class="btn-auth-submit" id="login-btn" onclick="handleLogin()">Sign In</button>

                <!-- Error / Info Messages -->
                <p id="error-msg" class="auth-error"></p>
                <p id="info-msg" class="auth-success"></p>

                <!-- Links -->
                <div class="auth-footer-link">
                    Don't have an account? <a href="signup.html">Sign Up</a>
                </div>
            </div>
        </div>

    </div>

    <script src="js/config.js?v=999"></script>
    <script>
        function togglePassword() {
            const pwInput = document.getElementById('password');
            const eyeIcon = document.getElementById('pw-eye-icon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function updateLabels() {
            const role = document.getElementById('role-select').value;
            const label = document.getElementById('id-label');
            const placeholder = document.getElementById('user-id');
            const deptGroup = document.getElementById('dept-group');
            const loginBtn = document.querySelector('.btn-auth-submit');

            const config = {
                doctor: { label: 'Mobile Number', ph: 'Enter your registered mobile number', btn: 'Sign In' },
                staff: { label: 'Mobile Number', ph: 'Enter your registered mobile number', btn: 'Sign In' },
                patient: { label: 'Mobile Number', ph: 'Enter your registered mobile number', btn: 'Login' }
            };

            label.textContent = config[role].label;
            placeholder.placeholder = config[role].ph;
            loginBtn.textContent = config[role].btn;

            // Show/Hide department
            deptGroup.style.display = role === 'staff' ? 'block' : 'none';
        }

        async function handleLogin() {
            const role = document.getElementById('role-select').value;
            const loginId = document.getElementById('user-id').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error-msg');
            const infoEl = document.getElementById('info-msg');
            const loginBtn = document.getElementById('login-btn');

            errorEl.style.display = 'none';
            infoEl.style.display = 'none';

            if (!loginId) {
                errorEl.textContent = "Please enter your mobile number.";
                errorEl.style.display = 'block';
                return;
            }

            if (!password) {
                errorEl.textContent = "Please enter your password.";
                errorEl.style.display = 'block';
                return;
            }

            // Disable button during request
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';

            try {
                const res = await fetch(API_BASE + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        login_id: loginId,
                        password: password,
                        role: role
                    })
                });

                const data = await res.json();

                if (res.ok) {
                    // Store session data in localStorage
                    localStorage.setItem('currentRole', data.role);
                    localStorage.setItem('currentUser', data.generated_id);
                    localStorage.setItem('currentUserId', data.user_id);
                    localStorage.setItem('currentUsername', data.username);
                    localStorage.setItem('currentMobile', data.mobile || '');

                    if (data.role === 'patient') {
                        localStorage.setItem('currentPatientId', data.generated_id);
                    }

                    // For staff: use the department selected in the dropdown (not backend's stored value)
                    if (data.role === 'staff') {
                        var selectedDept = document.getElementById('dept-select').value;
                        if (selectedDept) {
                            localStorage.setItem('currentDept', selectedDept);
                        } else if (data.department) {
                            localStorage.setItem('currentDept', data.department);
                        } else {
                            localStorage.removeItem('currentDept');
                        }
                    } else if (data.department) {
                        localStorage.setItem('currentDept', data.department);
                    } else {
                        localStorage.removeItem('currentDept');
                    }

                    // --- Check-in flow: perform check-in after auth ---
                    if (_checkinDept && data.role === 'staff') {
                        loginBtn.textContent = 'Checking in...';
                        try {
                            var checkinRes = await fetch(API_BASE + '/prediction/staff-checkin/' + encodeURIComponent(_checkinDept) + '?staff_id=' + encodeURIComponent(data.generated_id), { method: 'POST' });
                            if (checkinRes.ok) {
                                localStorage.setItem('currentDept', _checkinDept);
                                window.location.href = 'staff_panel.html';
                            } else if (checkinRes.status === 409) {
                                var checkinErr = await checkinRes.json();
                                infoEl.textContent = checkinErr.detail || 'Already checked in to this department.';
                                infoEl.style.display = 'block';
                                infoEl.style.color = '#f59e0b';
                                localStorage.setItem('currentDept', _checkinDept);
                                setTimeout(function() { window.location.href = 'staff_panel.html'; }, 2000);
                            } else {
                                errorEl.textContent = 'Check-in failed. Redirecting to dashboard...';
                                errorEl.style.display = 'block';
                                setTimeout(function() { window.location.href = 'staff_panel.html'; }, 2000);
                            }
                        } catch (checkinErr) {
                            errorEl.textContent = 'Check-in network error. Redirecting...';
                            errorEl.style.display = 'block';
                            setTimeout(function() { window.location.href = 'staff_panel.html'; }, 2000);
                        }
                        return;
                    }

                    // Redirect to role-specific dashboard
                    const dashboards = {
                        admin: 'admin_dashboard.html',
                        doctor: 'doctor_dashboard.html',
                        staff: 'staff_panel.html',
                        patient: 'patient_dashboard.html'
                    };
                    window.location.href = dashboards[data.role] || 'occupancy.html';
                } else if (res.status === 403) {
                    // Pending or rejected
                    infoEl.textContent = data.detail;
                    infoEl.style.display = 'block';
                    infoEl.style.color = '#f59e0b';
                } else {
                    errorEl.textContent = data.detail || "Login failed. Please check your credentials.";
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = "Server error. Please try again later.";
                errorEl.style.display = 'block';
                console.error("Login error:", err);
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = (role === 'patient') ? 'Login' : 'Sign In';
            }
        }

        // --- Check-in flow detection ---
        var _checkinDept = new URLSearchParams(window.location.search).get('checkin_dept');

        if (_checkinDept) {
            // Lock role to staff
            var roleSelect = document.getElementById('role-select');
            roleSelect.value = 'staff';
            roleSelect.disabled = true;

            // Show and lock department
            var deptGroup = document.getElementById('dept-group');
            var deptSelect = document.getElementById('dept-select');
            deptGroup.style.display = 'block';
            deptSelect.value = _checkinDept;
            deptSelect.disabled = true;

            // Update UI
            var deptNames = { registration:'Registration', vision_lab:'Vision Lab', dilation_hall:'Dilation Hall', diagnostics:'Diagnostics', pharmacy:'Pharmacy', billing_insurance:'Billing & Insurance', consultation:'Consultation' };
            document.getElementById('checkin-banner').style.display = 'block';
            document.getElementById('checkin-dept-display').textContent = deptNames[_checkinDept] || _checkinDept;
            document.getElementById('login-heading').textContent = 'Staff Check-in';
            document.getElementById('login-subheading').textContent = 'Verify your identity to check in';

            // Set labels
            document.getElementById('id-label').textContent = 'Mobile Number';
            document.getElementById('user-id').placeholder = 'Enter your registered mobile number';
            document.querySelector('.btn-auth-submit').textContent = 'Verify & Check In';
        } else {
            // Normal login flow
            updateLabels();
        }
    </script>
</body>

</html>
