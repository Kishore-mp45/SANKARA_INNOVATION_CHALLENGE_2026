<!DOCTYPE html>
<html lang="en">
<!-- PatientPath AI Login V4.0 -->

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatientPath AI - Login v4.0</title>
    <script src="js/theme.js?v=999"></script>
    <script>
        console.log("Login Page Loaded v4.0");

        // Clear any existing session to prevent confusion on load
        window.onload = function () {
            localStorage.removeItem('currentUser');
            localStorage.removeItem('currentRole');
            localStorage.removeItem('currentDept');
            console.log("Session cleared for fresh login.");
        };
    </script>
    <link rel="stylesheet" href="css/style.css?v=4.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-color);
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .brand-logo {
            margin-bottom: 2rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        select,
        input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus,
        input:focus {
            border-color: var(--primary-color);
        }

        .btn-login {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 1rem;
        }

        .btn-login:hover {
            opacity: 0.9;
        }

        /* Password wrapper for eye toggle */
        .pw-wrapper {
            position: relative;
        }

        .pw-wrapper input {
            padding-right: 2.75rem;
        }

        .pw-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        .pw-toggle:hover {
            color: var(--primary-color);
        }

        /* Password requirements */
        .pw-requirements {
            margin-top: 0.6rem;
            padding: 0;
            list-style: none;
        }

        .pw-req-item {
            font-size: 0.78rem;
            padding: 0.15rem 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .pw-req-item i {
            font-size: 0.7rem;
            width: 14px;
            text-align: center;
        }

        .pw-req-item.met {
            color: #10b981;
        }

        .pw-req-item.unmet {
            color: #ef4444;
        }
    </style>
</head>

<body>
    <div class="login-card fade-in">
        <div class="brand-logo"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="2">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg><span>PatientPath AI</span></div>
        <h3 style="margin-bottom: 1.5rem; color: var(--text-color);">Welcome Back</h3>
        <div class="form-group"><label for="role-select">Select Access Role</label><select id="role-select"
                onchange="updateLabels()">
                <option value="admin">Admin</option>
                <option value="doctor">Doctor</option>
                <option value="staff">Staff</option>
                <option value="patient">Patient</option>
            </select></div>
        <div class="form-group" id="dept-group" style="display: none;"><label for="dept-select">Select
                Department</label><select id="dept-select">
                <option value="registration">Registration</option>
                <option value="vision_lab">Vision Lab</option>
                <option value="dilation_hall">Dilation Hall</option>
                <option value="diagnostics">Diagnostics</option>
                <option value="pharmacy">Pharmacy</option>
                <option value="billing_insurance">Billing & Insurance</option>
            </select></div>
        <div class="form-group"><label id="id-label" for="user-id">Admin ID</label><input type="text" id="user-id"
                placeholder="Enter ID"></div>
        <div class="form-group" id="password-group">
            <label for="password">Password</label>
            <div class="pw-wrapper">
                <input type="password" id="password" placeholder="Enter Password" oninput="validatePasswordLive()">
                <button type="button" class="pw-toggle" onclick="togglePassword()" title="Show/Hide password">
                    <i class="fas fa-eye" id="pw-eye-icon"></i>
                </button>
            </div>
            <ul class="pw-requirements" id="pw-requirements">
                <li class="pw-req-item" id="req-length"><i class="fas fa-circle"></i> Minimum 8 characters</li>
                <li class="pw-req-item" id="req-upper"><i class="fas fa-circle"></i> At least one uppercase letter (A-Z)</li>
                <li class="pw-req-item" id="req-lower"><i class="fas fa-circle"></i> At least one lowercase letter (a-z)</li>
                <li class="pw-req-item" id="req-number"><i class="fas fa-circle"></i> At least one number (0-9)</li>
                <li class="pw-req-item" id="req-symbol"><i class="fas fa-circle"></i> At least one symbol (!@#$%&*)</li>
            </ul>
        </div>
        <button class="btn-login" onclick="handleLogin()">Login</button>
        <p id="error-msg" style="color: #ef4444; font-size: 0.9rem; margin-top: 1rem; display: none;"></p>
        <div style="margin-top: 1.5rem; font-size: 0.9rem; color: var(--text-muted);">New User? <a href="signup.html"
                style="color: var(--primary-color); text-decoration: none; font-weight: 500;">Sign up here</a></div>
    </div>

    <script>
        function togglePassword() {
            const pwInput = document.getElementById('password');
            const eyeIcon = document.getElementById('pw-eye-icon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function checkPasswordRules(password) {
            return {
                length: password.length >= 8,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                symbol: /[^A-Za-z0-9]/.test(password)
            };
        }

        function updateRequirementUI(rules, highlight) {
            const map = {
                length: 'req-length',
                upper: 'req-upper',
                lower: 'req-lower',
                number: 'req-number',
                symbol: 'req-symbol'
            };
            for (const [key, elId] of Object.entries(map)) {
                const el = document.getElementById(elId);
                const icon = el.querySelector('i');
                el.classList.remove('met', 'unmet');
                if (rules[key]) {
                    el.classList.add('met');
                    icon.className = 'fas fa-check-circle';
                } else if (highlight) {
                    el.classList.add('unmet');
                    icon.className = 'fas fa-times-circle';
                } else {
                    icon.className = 'fas fa-circle';
                }
            }
        }

        function validatePasswordLive() {
            const password = document.getElementById('password').value;
            const rules = checkPasswordRules(password);
            updateRequirementUI(rules, false);
        }

        function updateLabels() {
            const role = document.getElementById('role-select').value;
            const label = document.getElementById('id-label');
            const placeholder = document.getElementById('user-id');
            const deptGroup = document.getElementById('dept-group');
            const passwordGroup = document.getElementById('password-group');
            const loginBtn = document.querySelector('.btn-login');

            const config = {
                admin: { label: 'Admin ID', ph: 'Enter Admin ID', btn: 'Login' },
                doctor: { label: 'Doctor ID', ph: 'Enter Doctor ID', btn: 'Login' },
                staff: { label: 'Staff ID', ph: 'Enter Staff ID', btn: 'Login' },
                patient: { label: 'Patient Tracking ID', ph: 'Enter Patient ID (e.g. CV-12345)', btn: 'Track Status' }
            };

            label.textContent = config[role].label;
            placeholder.placeholder = config[role].ph;
            loginBtn.textContent = config[role].btn;

            // Show/Hide Logic
            if (role === 'patient') {
                passwordGroup.style.display = 'block';
                deptGroup.style.display = 'none';
            } else if (role === 'staff') {
                passwordGroup.style.display = 'block';
                deptGroup.style.display = 'block';
            } else {
                passwordGroup.style.display = 'block';
                deptGroup.style.display = 'none';
            }

            // Reset requirement indicators when switching roles
            const password = document.getElementById('password').value;
            if (password) {
                validatePasswordLive();
            }
        }

        function handleLogin() {
            const role = document.getElementById('role-select').value;
            const userId = document.getElementById('user-id').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error-msg');
            const deptSelect = document.getElementById('dept-select');

            errorEl.style.display = 'none';

            if (!userId) {
                errorEl.textContent = "Please enter your ID.";
                errorEl.style.display = 'block';
                return;
            }

            console.log("Attempting login", role, userId);

            // PATIENT FLOW
            if (role === 'patient') {
                if (!password) {
                    errorEl.textContent = "Please enter your password.";
                    errorEl.style.display = 'block';
                    return;
                }

                const users = JSON.parse(localStorage.getItem('ppa_users') || '{}');
                const user = users[userId];

                if (!user) {
                    errorEl.textContent = "Patient ID not found. Please sign up first.";
                    errorEl.style.display = 'block';
                    return;
                }

                if (user.role !== 'patient') {
                    errorEl.textContent = `ID exists but is not registered as patient. Try ${user.role}.`;
                    errorEl.style.display = 'block';
                    return;
                }

                if (user.password !== password) {
                    errorEl.textContent = "Invalid password. Ensure your password meets the requirements below.";
                    errorEl.style.display = 'block';
                    // Highlight unmet requirements
                    const rules = checkPasswordRules(password);
                    updateRequirementUI(rules, true);
                    return;
                }

                console.log("Redirecting to Patient Dashboard");
                localStorage.setItem('currentUser', userId);
                localStorage.setItem('currentPatientId', userId);
                localStorage.setItem('currentRole', 'patient');
                window.location.href = 'patient_dashboard.html?v=' + new Date().getTime();
                return;
            }

            // STAFF/ADMIN/DOCTOR FLOW
            if (!password) {
                errorEl.textContent = "Please enter credentials.";
                errorEl.style.display = 'block';
                return;
            }

            // Retrieve users
            const users = JSON.parse(localStorage.getItem('ppa_users') || '{}');
            const user = users[userId];

            if (!user) {
                errorEl.textContent = "User ID not found. Please sign up.";
                errorEl.style.display = 'block';
                return;
            }

            if (user.role !== role) {
                errorEl.textContent = `ID exists but is not registered as ${role}. Try ${user.role}.`;
                errorEl.style.display = 'block';
                return;
            }

            if (user.password !== password) {
                errorEl.textContent = "Invalid password. Ensure your password meets the requirements below.";
                errorEl.style.display = 'block';
                // Highlight unmet requirements
                const rules = checkPasswordRules(password);
                updateRequirementUI(rules, true);
                return;
            }

            // Success
            localStorage.setItem('currentRole', role);
            localStorage.setItem('currentUser', userId); // Track who is logged in

            // Save Department if Staff
            if (role === 'staff') {
                localStorage.setItem('currentDept', deptSelect.value);
            } else {
                localStorage.removeItem('currentDept');
            }

            window.location.href = 'index.html';
        }

        // Init labels logic
        updateLabels();
    </script>
</body>

</html>
