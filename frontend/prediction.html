<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PatientPath AI - Prediction</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .prediction-banner {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 2px solid var(--primary-color);
            border-radius: 1rem;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.3);
            margin: 2rem 0;
            overflow: hidden;
            position: relative;
        }

        .prediction-text {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .prediction-sub {
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
            <span>PatientPath AI</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-item"><span class="step-badge">1</span> About / Home</a></li>
            <li><a href="occupancy.html" class="nav-item"><span class="step-badge">2</span> Live Occupancy</a></li>
            <li><a href="heatmap.html" class="nav-item"><span class="step-badge">3</span> Zone Heatmap</a></li>
            <li><a href="metrics.html" class="nav-item"><span class="step-badge">4</span> Metrics</a></li>
            <li><a href="alerts.html" class="nav-item"><span class="step-badge">5</span> Alerts</a></li>
            <li><a href="charts.html" class="nav-item"><span class="step-badge">6</span> Charts</a></li>
            <li><a href="prediction.html" class="nav-item active"><span class="step-badge">7</span> Prediction</a></li>
            <li><a href="video.html" class="nav-item"><span class="step-badge">8</span> Live Video</a></li>
            <li><a href="doctor_dashboard.html" class="nav-item"><span class="step-badge">9</span> Doctor Panel</a></li>
            <li><a href="staff_panel.html" class="nav-item"><span class="step-badge">9</span> Staff Panel</a></li>
        </ul>
    </div>

    <div class="main-content">
        <!-- Full-Width AI Predictions Layout -->
        <div class="predictions-layout fade-in" style="display: block;">

            <!-- AI Predictions -->
            <div class="col-predictions">
                <div class="section-header">
                    <h2><i class="fas fa-brain" style="color: var(--primary-color); margin-right: 10px;"></i>AI
                        Predictions</h2>
                    <span class="badge-ml">ML-Powered</span>
                </div>

                <div id="predictions-list">
                    <!-- Loading State -->
                    <div class="prediction-card loading-card">
                        <div class="skeleton-line" style="width: 60%;"></div>
                        <div class="skeleton-line" style="width: 90%;"></div>
                        <div class="skeleton-line" style="width: 80%;"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/main.js?v=999"></script>
    <!-- Use FontAwesome for icons if not already included, checking head -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        const API_URL = API_BASE + '/prediction/bottleneck';
        const predList = document.getElementById('predictions-list');

        async function fetchPrediction() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                renderPredictions(data);
            } catch (error) {
                console.error("Prediction fetch error:", error);
                predList.innerHTML = '<div class="error-msg">Failed to load predictions. System requires backend connection.</div>';
            }
        }

        function renderPredictions(data) {
            if (data.predictions && data.predictions.length > 0) {
                predList.innerHTML = data.predictions.map(function(p) {
                    return '<div class="prediction-card border-left-' + p.severity + '">' +
                        '<div class="pred-header">' +
                            '<div class="pred-meta">' +
                                '<div class="pred-icon-circle"><i class="fas ' + p.icon + '"></i></div>' +
                                '<span class="pred-time">' + p.department + '</span>' +
                            '</div>' +
                            '<span class="confidence-badge">' + p.confidence + ' confidence</span>' +
                        '</div>' +
                        '<h3 class="pred-title">' + p.classification + '</h3>' +
                        '<div class="pred-recommendation">' +
                            '<i class="far fa-lightbulb"></i>' +
                            '<span><strong>Status:</strong> ' + p.active_patients + ' active patients | ' + p.staff_count + ' staff on duty</span>' +
                        '</div>' +
                    '</div>';
                }).join('');
            } else {
                predList.innerHTML = '<div class="empty-state">No active predictions at this time.</div>';
            }
        }

        // Initial Load
        fetchPrediction();
        // Poll every 30 seconds
        setInterval(fetchPrediction, 30000);
    </script>
</body>

</html>
