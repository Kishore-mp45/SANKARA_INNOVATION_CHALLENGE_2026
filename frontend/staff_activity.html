<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatientPath AI - Recent Activity</title>
    <link rel="stylesheet" href="css/style.css?v=200">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .activity-container { max-width: 800px; margin: 0 auto; padding: 2rem; }

        .summary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem; }
        .summary-item {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 10px; padding: 1rem 1.25rem; text-align: center;
        }
        .summary-item .s-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.3rem; }
        .summary-item .s-value { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }

        .activity-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px rgba(0,0,0,0.15);
        }
        .activity-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color);
        }
        .activity-header h3 { font-size: 1.05rem; font-weight: 600; color: var(--text-main); display: flex; align-items: center; gap: 0.6rem; }

        .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-muted); }
        .empty-state i { font-size: 2.5rem; margin-bottom: 0.75rem; display: block; opacity: 0.5; }

        .history-item { padding: 0.75rem 0.5rem; border-bottom: 1px solid var(--glass-border); font-size: 0.9rem; }
        .history-item:last-child { border-bottom: none; }
        .history-item:hover { background: rgba(255,255,255,0.02); }
        .history-time { color: var(--text-muted); font-size: 0.75rem; }
        .history-action { color: var(--primary-color); font-weight: 600; }
        .history-zone { color: var(--text-muted); font-size: 0.8rem; }
        .badge-action { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
        .badge-move { background: #059669; color: #fff; }
        .badge-task { background: #7c3aed; color: #fff; }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="brand">
            <img src="assets/Sankara-Eye-Foundation-Logo.png" alt="SANKARA EYE FOUNDATION" style="width:32px;height:32px;object-fit:contain;">
            <span>PatientPath AI</span>
        </div>
        <ul class="nav-menu"></ul>
    </div>

    <div class="main-content">
        <header>
            <div class="header-title-container">
                <h1>Recent Activity</h1>
                <p class="header-subtitle">History of QR scans, zone actions, and patient movements</p>
            </div>
        </header>

        <div class="page-container fade-in">
            <div class="activity-container">

                <!-- Summary -->
                <div class="summary-row">
                    <div class="summary-item">
                        <div class="s-label">Total Actions</div>
                        <div class="s-value" id="total-actions">0</div>
                    </div>
                    <div class="summary-item">
                        <div class="s-label">Last Action</div>
                        <div class="s-value" id="last-action-time">--</div>
                    </div>
                </div>

                <!-- Activity list -->
                <div class="activity-card">
                    <div class="activity-header">
                        <h3><i class="fas fa-history" style="color: var(--primary-color);"></i> Activity Log</h3>
                    </div>
                    <div id="activity-list"></div>
                    <div class="empty-state" id="empty-state" style="display:none;">
                        <i class="fas fa-clipboard-list"></i>
                        No activity recorded yet. Actions from the QR Scanner will appear here.
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/theme.js?v=999"></script>
    <script src="js/config.js?v=999"></script>
    <script src="js/main.js?v=999"></script>

    <script>
        var currentUserId = localStorage.getItem('currentUser') || 'unknown';
        var HISTORY_KEY = 'qrScannerHistory_' + currentUserId;
        var ACTION_COUNT_KEY = 'staffActionCount_' + currentUserId;

        function fmtZone(z) {
            if (!z) return '--';
            var m = {"registration":"Registration","vision_lab":"Vision Lab","dilation_hall":"Dilation Hall","diagnostics":"Diagnostics","consultation":"Consultation","pharmacy":"Pharmacy","billing_insurance":"Billing & Insurance"};
            return m[z] || z.replace(/_/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();});
        }

        function loadActivityLog() {
            var listEl = document.getElementById('activity-list');
            var emptyState = document.getElementById('empty-state');
            listEl.innerHTML = '';

            var history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');

            if (history.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';

            listEl.innerHTML = history.map(function (h) {
                var t = new Date(h.time);
                var timeStr = t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
                var dateStr = t.toLocaleDateString([],{month:'short',day:'numeric'});

                if (h.type === 'move') {
                    return '<div class="history-item">' +
                        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                        '<div><span class="badge-action badge-move">QR MOVE</span> <strong>' + h.tracking_id + '</strong></div>' +
                        '<span class="history-time">' + dateStr + ' ' + timeStr + '</span></div>' +
                        '<div class="history-zone" style="margin-top:0.25rem;">' + fmtZone(h.from_zone) + ' &rarr; ' + fmtZone(h.to_zone) + '</div></div>';
                } else {
                    return '<div class="history-item">' +
                        '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                        '<div><span class="badge-action badge-task">ACTION</span> <strong>' + h.tracking_id + '</strong></div>' +
                        '<span class="history-time">' + dateStr + ' ' + timeStr + '</span></div>' +
                        '<div style="margin-top:0.25rem;"><span class="history-action">' + h.action + '</span> <span class="history-zone">@ ' + fmtZone(h.from_zone) + '</span></div></div>';
                }
            }).join('');

            // Update summary
            document.getElementById('total-actions').textContent = parseInt(localStorage.getItem(ACTION_COUNT_KEY) || '0');
            if (history.length > 0) {
                var lastTime = new Date(history[0].time);
                document.getElementById('last-action-time').textContent = lastTime.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',hour12:false});
            }
        }

        loadActivityLog();
    </script>
</body>
</html>
