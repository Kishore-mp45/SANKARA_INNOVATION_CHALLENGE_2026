<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PatientPath AI - Sign Up</title>
    <link rel="stylesheet" href="css/style.css?v=4.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: var(--bg-color);
            margin: 0;
        }

        .login-card {
            background: var(--card-bg);
            padding: 2.5rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .brand-logo {
            margin-bottom: 2rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.25rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        select,
        input {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 0.5rem;
            color: var(--text-color);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        select:focus,
        input:focus {
            border-color: var(--primary-color);
        }

        .btn-auth {
            width: 100%;
            padding: 0.75rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 1rem;
        }

        .btn-auth:hover {
            opacity: 0.9;
        }

        .auth-link {
            margin-top: 1.5rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .auth-link a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .error-msg {
            color: #ef4444;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        .success-msg {
            color: #10b981;
            font-size: 0.9rem;
            margin-top: 0.5rem;
            display: none;
        }

        /* Password wrapper for eye toggle */
        .pw-wrapper {
            position: relative;
        }

        .pw-wrapper input {
            padding-right: 2.75rem;
        }

        .pw-toggle {
            position: absolute;
            right: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0;
            font-size: 1rem;
            line-height: 1;
            display: flex;
            align-items: center;
        }

        .pw-toggle:hover {
            color: var(--primary-color);
        }

        /* Password requirements */
        .pw-requirements {
            margin-top: 0.6rem;
            padding: 0;
            list-style: none;
        }

        .pw-req-item {
            font-size: 0.78rem;
            padding: 0.15rem 0;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-muted);
            transition: color 0.2s;
        }

        .pw-req-item i {
            font-size: 0.7rem;
            width: 14px;
            text-align: center;
        }

        .pw-req-item.met {
            color: #10b981;
        }

        .pw-req-item.unmet {
            color: #ef4444;
        }
    </style>
</head>

<body>

    <div class="login-card fade-in">
        <div class="brand-logo">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
            <span>PatientPath AI</span>
        </div>

        <h3 style="margin-bottom: 1.5rem; color: var(--text-color);">Create Account</h3>

        <div class="form-group">
            <label for="role-select">Select Role</label>
            <select id="role-select" onchange="updateLabels()">
                <option value="admin">Admin</option>
                <option value="doctor">Doctor</option>
                <option value="staff">Staff</option>
                <option value="patient">Patient</option>
            </select>
        </div>

        <div class="form-group">
            <label id="id-label" for="user-id">Admin ID</label>
            <input type="text" id="user-id" placeholder="Enter ID (e.g., ADM001)">
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="pw-wrapper">
                <input type="password" id="password" placeholder="Create a password" oninput="validatePasswordLive()">
                <button type="button" class="pw-toggle" onclick="togglePassword()" title="Show/Hide password">
                    <i class="fas fa-eye" id="pw-eye-icon"></i>
                </button>
            </div>
            <ul class="pw-requirements" id="pw-requirements">
                <li class="pw-req-item" id="req-length"><i class="fas fa-circle"></i> Minimum 8 characters</li>
                <li class="pw-req-item" id="req-upper"><i class="fas fa-circle"></i> At least one uppercase letter (A-Z)</li>
                <li class="pw-req-item" id="req-lower"><i class="fas fa-circle"></i> At least one lowercase letter (a-z)</li>
                <li class="pw-req-item" id="req-number"><i class="fas fa-circle"></i> At least one number (0-9)</li>
                <li class="pw-req-item" id="req-symbol"><i class="fas fa-circle"></i> At least one symbol (!@#$%&*)</li>
            </ul>
        </div>

        <button class="btn-auth" onclick="handleSignup()">Sign Up</button>

        <div id="message-area" style="min-height: 20px;">
            <p class="error-msg" id="error-text"></p>
            <p class="success-msg" id="success-text"></p>
        </div>

        <div class="auth-link">
            Already have an account? <a href="login.html">Login here</a>
        </div>
    </div>

    <script>
        function updateLabels() {
            const role = document.getElementById('role-select').value;
            const label = document.getElementById('id-label');
            const placeholder = document.getElementById('user-id');

            const config = {
                admin: { label: 'Admin ID', ph: 'Enter Admin ID' },
                doctor: { label: 'Doctor ID', ph: 'Enter Doctor ID' },
                staff: { label: 'Staff ID', ph: 'Enter Staff ID' },
                patient: { label: 'Patient ID', ph: 'Enter Patient ID' }
            };

            label.textContent = config[role].label;
            placeholder.placeholder = config[role].ph;
        }

        function togglePassword() {
            const pwInput = document.getElementById('password');
            const eyeIcon = document.getElementById('pw-eye-icon');
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        function checkPasswordRules(password) {
            return {
                length: password.length >= 8,
                upper: /[A-Z]/.test(password),
                lower: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                symbol: /[^A-Za-z0-9]/.test(password)
            };
        }

        function updateRequirementUI(rules, highlight) {
            const map = {
                length: 'req-length',
                upper: 'req-upper',
                lower: 'req-lower',
                number: 'req-number',
                symbol: 'req-symbol'
            };
            for (const [key, elId] of Object.entries(map)) {
                const el = document.getElementById(elId);
                const icon = el.querySelector('i');
                el.classList.remove('met', 'unmet');
                if (rules[key]) {
                    el.classList.add('met');
                    icon.className = 'fas fa-check-circle';
                } else if (highlight) {
                    el.classList.add('unmet');
                    icon.className = 'fas fa-times-circle';
                } else {
                    icon.className = 'fas fa-circle';
                }
            }
        }

        function validatePasswordLive() {
            const password = document.getElementById('password').value;
            const rules = checkPasswordRules(password);
            // Show green checks as user types, but don't show red until they try to submit
            updateRequirementUI(rules, false);
        }

        function handleSignup() {
            const role = document.getElementById('role-select').value;
            const userId = document.getElementById('user-id').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorEl = document.getElementById('error-text');
            const successEl = document.getElementById('success-text');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            if (!userId || !password) {
                errorEl.textContent = "Please fill in all fields.";
                errorEl.style.display = 'block';
                return;
            }

            // Validate password strength
            const rules = checkPasswordRules(password);
            const allMet = Object.values(rules).every(v => v);
            updateRequirementUI(rules, true); // Highlight unmet in red

            if (!allMet) {
                errorEl.textContent = "Password does not meet the requirements.";
                errorEl.style.display = 'block';
                return;
            }

            // Get existing users
            const users = JSON.parse(localStorage.getItem('ppa_users') || '{}');

            // Check if ID already exists
            if (users[userId]) {
                errorEl.textContent = "ID already registered. Please login.";
                errorEl.style.display = 'block';
                return;
            }

            // Save user
            users[userId] = {
                role: role,
                password: password
            };
            localStorage.setItem('ppa_users', JSON.stringify(users));

            successEl.textContent = "Account created successfully! Redirecting...";
            successEl.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1000);
        }

        // Initialize
        updateLabels();
    </script>
</body>

</html>
