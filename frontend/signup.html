<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register – Sankara Eye Foundation | PatientPathAI</title>
    <meta name="description" content="Create your account on PatientPathAI – Sankara Eye Foundation's AI-powered hospital operations platform.">
    <link rel="stylesheet" href="css/auth.css?v=6.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="auth-container">

        <!-- LEFT PANEL -->
        <div class="auth-left">
            <img src="assets/doctor_hero.png" alt="Doctor" class="auth-left-img">
            <div class="auth-left-overlay"></div>
            <div class="auth-left-content">
                <div class="auth-left-logo">
                    <svg class="logo-icon" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <ellipse cx="60" cy="50" rx="28" ry="28" fill="#E88A1A"/>
                        <polygon points="5,50 32,30 32,70" fill="#E88A1A"/>
                        <polygon points="115,50 88,30 88,70" fill="#E88A1A"/>
                        <circle cx="60" cy="50" r="18" fill="#F5A623" opacity="0.7"/>
                        <circle cx="60" cy="50" r="10" fill="#FFC857" opacity="0.5"/>
                    </svg>
                    <span>PatientPathAI</span>
                </div>
                <div class="auth-left-welcome">Join<br>Sankara Eye Foundation</div>
                <p class="auth-left-sub">Create your account to access AI-powered patient flow management and hospital operations.</p>
            </div>
        </div>

        <!-- RIGHT PANEL (Register Form) -->
        <div class="auth-right">
            <div class="auth-brand-top">
                <svg class="logo-icon" viewBox="0 0 120 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <ellipse cx="60" cy="50" rx="28" ry="28" fill="#E88A1A"/>
                    <polygon points="5,50 32,30 32,70" fill="#E88A1A"/>
                    <polygon points="115,50 88,30 88,70" fill="#E88A1A"/>
                    <circle cx="60" cy="50" r="18" fill="#F5A623" opacity="0.7"/>
                    <circle cx="60" cy="50" r="10" fill="#FFC857" opacity="0.5"/>
                </svg>
                <span class="brand-label">PatientPathAI</span>
            </div>

            <h2 class="auth-heading">Create Account</h2>
            <p class="auth-subheading">Fill in your details to register</p>

            <div class="auth-form">
                <!-- Role Select (No Admin option) -->
                <div class="form-group">
                    <label for="role-select">Select Role</label>
                    <select id="role-select" onchange="updateLabels()">
                        <option value="patient">Patient</option>
                        <option value="staff">Staff</option>
                        <option value="doctor">Doctor</option>
                    </select>
                </div>

                <!-- Department (staff only) -->
                <div class="form-group" id="dept-group" style="display: none;">
                    <label for="dept-select">Select Department</label>
                    <select id="dept-select">
                        <option value="registration">Registration</option>
                        <option value="vision_lab">Vision Lab</option>
                        <option value="dilation_hall">Dilation Hall</option>
                        <option value="diagnostics">Diagnostics</option>
                        <option value="pharmacy">Pharmacy</option>
                        <option value="billing_insurance">Billing & Insurance</option>
                    </select>
                </div>

                <!-- Name -->
                <div class="form-group">
                    <label for="user-name">Full Name</label>
                    <input type="text" id="user-name" placeholder="Enter your full name">
                </div>

                <!-- Mobile Number -->
                <div class="form-group" id="mobile-group">
                    <label id="mobile-label" for="mobile">Mobile Number <span id="mobile-required" style="color:#ef4444;">*</span></label>
                    <input type="tel" id="mobile" placeholder="Enter your mobile number">
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="pw-wrapper">
                        <input type="password" id="password" placeholder="Create a password">
                        <button type="button" class="pw-toggle" onclick="togglePassword('password', 'pw-eye-icon')" title="Show/Hide password">
                            <i class="fas fa-eye" id="pw-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <div class="pw-wrapper">
                        <input type="password" id="confirm-password" placeholder="Re-enter your password">
                        <button type="button" class="pw-toggle" onclick="togglePassword('confirm-password', 'cpw-eye-icon')" title="Show/Hide password">
                            <i class="fas fa-eye" id="cpw-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <!-- Register Button -->
                <button class="btn-auth-submit" id="register-btn" onclick="handleSignup()">Register</button>

                <!-- Messages -->
                <p class="auth-error" id="error-text"></p>
                <p class="auth-success" id="success-text"></p>

                <div class="auth-footer-link">
                    Already have an account? <a href="login.html">Login here</a>
                </div>
            </div>
        </div>

    </div>

    <!-- Theme -->
    <script src="js/theme.js?v=1000"></script>
    <script src="js/config.js?v=999"></script>

    <script>
        function updateLabels() {
            const role = document.getElementById('role-select').value;
            const deptGroup = document.getElementById('dept-group');
            const mobileRequired = document.getElementById('mobile-required');

            // Show department dropdown only for staff
            deptGroup.style.display = role === 'staff' ? 'block' : 'none';

            // Mobile is required for all roles
            mobileRequired.style.display = 'inline';
        }

        function togglePassword(inputId, iconId) {
            const pwInput = document.getElementById(inputId);
            const eyeIcon = document.getElementById(iconId);
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                pwInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        }

        async function handleSignup() {
            const role = document.getElementById('role-select').value;
            const username = document.getElementById('user-name').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            const department = document.getElementById('dept-select').value;
            const errorEl = document.getElementById('error-text');
            const successEl = document.getElementById('success-text');
            const registerBtn = document.getElementById('register-btn');

            errorEl.style.display = 'none';
            successEl.style.display = 'none';

            // Validate required fields
            if (!username || !password || !confirmPassword) {
                errorEl.textContent = "Please fill in all required fields.";
                errorEl.style.display = 'block';
                return;
            }

            if (!mobile) {
                errorEl.textContent = "Mobile number is required.";
                errorEl.style.display = 'block';
                return;
            }

            if (password !== confirmPassword) {
                errorEl.textContent = "Passwords do not match.";
                errorEl.style.display = 'block';
                return;
            }

            // Build request body
            const body = {
                username: username,
                password: password,
                confirm_password: confirmPassword,
                mobile: mobile || null,
                role: role,
                department: role === 'staff' ? department : null
            };

            // Disable button during request
            registerBtn.disabled = true;
            registerBtn.textContent = 'Registering...';

            try {
                const res = await fetch(API_BASE + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                const data = await res.json();

                if (res.ok) {
                    successEl.innerHTML = `
                        Registration submitted successfully!<br>
                        <span style="font-size:0.85em;">Please wait for approval before logging in.</span>
                    `;
                    successEl.style.display = 'block';

                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 3000);
                } else {
                    errorEl.textContent = data.detail || "Registration failed. Please try again.";
                    errorEl.style.display = 'block';
                }
            } catch (err) {
                errorEl.textContent = "Server error. Please try again later.";
                errorEl.style.display = 'block';
                console.error("Registration error:", err);
            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = 'Register';
            }
        }

        // Initialize
        updateLabels();
    </script>
</body>

</html>
