<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PatientPath AI - Alerts</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .alerts-page {
            padding: 2rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .alerts-page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .alerts-page-header h1 {
            font-size: 1.5rem;
            color: var(--primary-color, #0ea5e9);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .alerts-page-header h1 i {
            font-size: 1.3rem;
            color: #f59e0b;
        }

        .alert-counter-pills {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .counter-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.35rem 0.85rem;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .counter-pill.critical {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .counter-pill.warning {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .counter-pill.clear {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
        }

        /* Two-column layout */
        .alerts-layout {
            display: grid;
            grid-template-columns: 1fr 380px;
            gap: 1.5rem;
        }

        @media (max-width: 900px) {
            .alerts-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Alerts list */
        .alerts-list-panel {
            background: var(--card-bg, #1e293b);
            border: 1px solid var(--border-color, #334155);
            border-radius: 12px;
            padding: 1.25rem;
        }

        .alerts-list-panel h2 {
            font-size: 1rem;
            color: var(--text-main, #e2e8f0);
            margin: 0 0 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .alerts-list-panel h2 i {
            color: #f59e0b;
        }

        .alert-card {
            background: var(--sidebar-bg, #0f172a);
            border: 1px solid var(--border-color, #334155);
            border-left: 4px solid;
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 0.75rem;
            transition: opacity 0.3s, transform 0.3s;
        }

        .alert-card.critical {
            border-left-color: #ef4444;
        }

        .alert-card.warning {
            border-left-color: #f59e0b;
        }

        .alert-card.info {
            border-left-color: #0ea5e9;
        }

        .alert-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .alert-card-meta {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .alert-card-icon {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
        }

        .alert-card.critical .alert-card-icon {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
        }

        .alert-card.warning .alert-card-icon {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
        }

        .alert-source-badge {
            font-size: 0.65rem;
            padding: 0.15rem 0.5rem;
            border-radius: 999px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            background: rgba(148, 163, 184, 0.12);
            color: var(--text-muted, #94a3b8);
        }

        .alert-card-msg {
            font-size: 0.9rem;
            color: var(--text-main, #e2e8f0);
            font-weight: 600;
            line-height: 1.4;
        }

        .alert-card-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 0.75rem;
        }

        .btn-resolve {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.7rem;
            background: rgba(16, 185, 129, 0.12);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-resolve:hover {
            background: rgba(16, 185, 129, 0.25);
        }

        .btn-dismiss {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.7rem;
            background: transparent;
            color: var(--text-muted, #94a3b8);
            border: 1px solid var(--border-color, #334155);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-dismiss:hover {
            background: rgba(148, 163, 184, 0.1);
        }

        /* Decision Support panel */
        .decisions-panel {
            background: var(--card-bg, #1e293b);
            border: 1px solid var(--border-color, #334155);
            border-radius: 12px;
            padding: 1.25rem;
            height: fit-content;
        }

        .decisions-panel h2 {
            font-size: 1rem;
            color: var(--text-main, #e2e8f0);
            margin: 0 0 1rem 0;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .decisions-panel h2 i {
            color: #f59e0b;
        }

        .decision-card {
            background: var(--sidebar-bg, #0f172a);
            border: 1px solid var(--border-color, #334155);
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 0.75rem;
            transition: opacity 0.3s, transform 0.3s;
        }

        .decision-title {
            font-size: 0.85rem;
            color: var(--text-main, #e2e8f0);
            font-weight: 600;
            margin: 0 0 0.5rem 0;
            line-height: 1.4;
        }

        .decision-desc {
            font-size: 0.8rem;
            color: var(--text-muted, #94a3b8);
            line-height: 1.5;
            margin-bottom: 0.75rem;
        }

        .decision-actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn-action-apply {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.35rem 0.8rem;
            background: var(--primary-color, #0ea5e9);
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-action-apply:hover {
            opacity: 0.85;
        }

        .btn-action-apply.applied {
            background: #10b981;
            pointer-events: none;
        }

        .btn-action-dismiss {
            padding: 0.35rem 0.8rem;
            background: transparent;
            color: var(--text-muted, #94a3b8);
            border: 1px solid var(--border-color, #334155);
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .empty-alert-state {
            text-align: center;
            padding: 2.5rem 1rem;
            color: var(--text-muted, #94a3b8);
        }

        .empty-alert-state i {
            font-size: 2rem;
            display: block;
            margin-bottom: 0.75rem;
            opacity: 0.4;
        }

        .empty-alert-state p {
            font-size: 0.9rem;
            margin: 0;
        }

        @keyframes slideInRight {
            from {
                transform: translateX(30px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .alert-card {
            animation: slideInRight 0.4s ease forwards;
        }
    </style>
</head>

<body>
    <div class="sidebar">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
            </svg>
            <span>PatientPath AI</span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html" class="nav-item"><span class="step-badge">1</span> About / Home</a></li>
            <li><a href="occupancy.html" class="nav-item"><span class="step-badge">2</span> Live Occupancy</a></li>
            <li><a href="heatmap.html" class="nav-item"><span class="step-badge">3</span> Zone Heatmap</a></li>
            <li><a href="metrics.html" class="nav-item"><span class="step-badge">4</span> Metrics</a></li>
            <li><a href="alerts.html" class="nav-item active"><span class="step-badge">5</span> Alerts</a></li>
            <li><a href="charts.html" class="nav-item"><span class="step-badge">6</span> Charts</a></li>
            <li><a href="prediction.html" class="nav-item"><span class="step-badge">7</span> Prediction</a></li>
            <li><a href="video.html" class="nav-item"><span class="step-badge">8</span> Live Video</a></li>
            <li><a href="doctor_dashboard.html" class="nav-item"><span class="step-badge">9</span> Doctor Panel</a></li>
            <li><a href="staff_panel.html" class="nav-item"><span class="step-badge">9</span> Staff Panel</a></li>
        </ul>
    </div>

    <div class="main-content">
        <div class="alerts-page fade-in">

            <!-- Header -->
            <div class="alerts-page-header">
                <h1><i class="fas fa-exclamation-triangle"></i> Active Alerts</h1>
                <div class="alert-counter-pills" id="alert-counters">
                    <span class="counter-pill clear"><i class="fas fa-spinner fa-spin"></i> Loading...</span>
                </div>
            </div>

            <!-- Two-Column Layout -->
            <div class="alerts-layout">

                <!-- Left: Active Alerts -->
                <div class="alerts-list-panel">
                    <h2><i class="fas fa-bell"></i> AI-Generated Alerts</h2>
                    <div id="alerts-list">
                        <div class="empty-alert-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading alerts from AI models...</p>
                        </div>
                    </div>
                </div>

                <!-- Right: Decision Support -->
                <div class="decisions-panel">
                    <h2><i class="fas fa-bolt"></i> Decision Support</h2>
                    <div id="decisions-list">
                        <div class="empty-alert-state">
                            <i class="fas fa-spinner fa-spin"></i>
                            <p>Loading...</p>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/main.js?v=999"></script>
    <script>
        var API_BASE = 'http://localhost:8000';
        var alertsList = document.getElementById('alerts-list');
        var decisionsList = document.getElementById('decisions-list');
        var countersPill = document.getElementById('alert-counters');
        var dismissedAlerts = {};

        async function fetchLiveAlerts() {
            try {
                var res = await fetch(API_BASE + '/prediction/live-alerts');
                if (!res.ok) throw new Error('Failed to fetch');
                var data = await res.json();
                renderAlerts(data.alerts || []);
                renderDecisions(data.decisions || []);
                renderCounters(data);
            } catch (e) {
                console.error('Alert fetch error:', e);
                alertsList.innerHTML = '<div class="empty-alert-state"><i class="fas fa-exclamation-circle"></i><p>Could not load alerts. Retrying...</p></div>';
            }
        }

        function renderCounters(data) {
            var html = '';
            if (data.critical_count > 0) {
                html += '<span class="counter-pill critical"><i class="fas fa-exclamation-circle"></i> ' + data.critical_count + ' Critical</span>';
            }
            if (data.warning_count > 0) {
                html += '<span class="counter-pill warning"><i class="fas fa-exclamation-triangle"></i> ' + data.warning_count + ' Warning</span>';
            }
            if (data.total_count === 0) {
                html += '<span class="counter-pill clear"><i class="fas fa-check-circle"></i> All Clear</span>';
            }
            countersPill.innerHTML = html;
        }

        function renderAlerts(alerts) {
            // Filter out dismissed alerts
            var visible = alerts.filter(function(a) { return !dismissedAlerts[a.id]; });

            if (visible.length === 0) {
                alertsList.innerHTML = '<div class="empty-alert-state"><i class="fas fa-shield-alt"></i><p>No active alerts. All departments operating normally.</p></div>';
                return;
            }

            var html = '';
            visible.forEach(function(alert, idx) {
                var iconHtml = alert.icon ? '<i class="fas ' + alert.icon + '"></i>' : '<i class="fas fa-exclamation-triangle"></i>';
                var confHtml = alert.confidence ? ' <span style="font-size:0.7rem;color:var(--text-muted);">(' + alert.confidence + ')</span>' : '';
                var sourceHtml = alert.source ? '<span class="alert-source-badge">' + alert.source + '</span>' : '';

                html += '<div class="alert-card ' + alert.severity + '" id="alert-' + idx + '">' +
                    '<div class="alert-card-header">' +
                        '<div class="alert-card-meta">' +
                            '<div class="alert-card-icon">' + iconHtml + '</div>' +
                            sourceHtml +
                        '</div>' +
                        confHtml +
                    '</div>' +
                    '<div class="alert-card-msg">' + alert.msg + '</div>' +
                    '<div class="alert-card-actions">' +
                        '<button class="btn-resolve" onclick="resolveAlert(\'' + alert.id + '\', this)"><i class="far fa-check-circle"></i> Resolve</button>' +
                        '<button class="btn-dismiss" onclick="dismissAlert(\'' + alert.id + '\', this)"><i class="fas fa-times"></i> Dismiss</button>' +
                    '</div>' +
                '</div>';
            });

            alertsList.innerHTML = html;
        }

        function renderDecisions(decisions) {
            if (!decisions || decisions.length === 0) {
                decisionsList.innerHTML = '<div class="empty-alert-state"><i class="fas fa-check-circle"></i><p>No pending decisions.</p></div>';
                return;
            }

            var html = '';
            decisions.forEach(function(d, idx) {
                var typeIcon = 'fa-check-circle';
                if (d.type === 'staff') typeIcon = 'fa-user-plus';
                else if (d.type === 'redirect') typeIcon = 'fa-arrow-right';
                else if (d.type === 'normal') typeIcon = 'fa-check-circle';

                html += '<div class="decision-card" id="dec-' + idx + '">' +
                    '<h4 class="decision-title"><i class="fas ' + typeIcon + '" style="color: var(--primary-color, #0ea5e9); margin-right: 0.4rem; font-size: 0.8rem;"></i>' + (d.title || '') + '</h4>' +
                    '<div class="decision-desc">' + d.description + '</div>' +
                    '<div class="decision-actions">' +
                        '<button class="btn-action-apply" onclick="applyDecision(' + idx + ')"><i class="fas fa-check-circle"></i> ' + (d.action_label || 'Apply') + '</button>' +
                        '<button class="btn-action-dismiss" onclick="dismissDecision(' + idx + ')">Dismiss</button>' +
                    '</div>' +
                '</div>';
            });

            decisionsList.innerHTML = html;
        }

        function resolveAlert(alertId, btn) {
            var card = btn.closest('.alert-card');
            btn.innerHTML = '<i class="fas fa-check"></i> Resolved';
            btn.style.background = 'rgba(16,185,129,0.25)';
            dismissedAlerts[alertId] = true;

            setTimeout(function() {
                card.style.opacity = '0.4';
                card.style.pointerEvents = 'none';
                setTimeout(function() {
                    card.style.height = '0';
                    card.style.margin = '0';
                    card.style.padding = '0';
                    card.style.overflow = 'hidden';
                    setTimeout(function() { card.remove(); }, 300);
                }, 800);
            }, 500);
        }

        function dismissAlert(alertId, btn) {
            var card = btn.closest('.alert-card');
            dismissedAlerts[alertId] = true;
            card.style.transform = 'translateX(100%)';
            card.style.opacity = '0';
            setTimeout(function() { card.remove(); }, 300);
        }

        function applyDecision(index) {
            var card = document.getElementById('dec-' + index);
            if (!card) return;
            var btn = card.querySelector('.btn-action-apply');

            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Applying...';
            btn.style.opacity = '0.8';

            setTimeout(function() {
                btn.innerHTML = '<i class="fas fa-check"></i> Applied';
                btn.classList.add('applied');
                setTimeout(function() {
                    card.style.opacity = '0.5';
                    card.style.pointerEvents = 'none';
                }, 800);
            }, 600);
        }

        function dismissDecision(index) {
            var card = document.getElementById('dec-' + index);
            if (!card) return;
            card.style.opacity = '0';
            setTimeout(function() { card.remove(); }, 300);
        }

        // Initial load
        fetchLiveAlerts();
        // Poll every 30 seconds
        setInterval(fetchLiveAlerts, 30000);
    </script>
</body>

</html>
