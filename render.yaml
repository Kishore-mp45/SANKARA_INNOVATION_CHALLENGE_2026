services:
  - type: web
    name: patientpath-ai
    runtime: python
    plan: free
    region: oregon
    branch: patientpath-ai
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_SQLITE
        value: "true"
      - key: DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.6"
